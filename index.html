    <style>

        .spinner { width: 40px; height: 40px; border: 4px solid #ddd; border-top-color: #2b4f60; border-radius: 50%; animation: spin 1s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
        .animate-fade-in { animation: fadeIn 0.4s cubic-bezier(0.22, 1, 0.36, 1) forwards; }

                    '<button onclick="window.location.reload()" style="margin-top:20px; padding:10px 20px; background:#333; color:white; border:none; border-radius:8px;">重新整理</button>' +
                    '</div>';

        };

            get: (target, prop) => {
                return ({ size = 20, className = "", color, strokeWidth = 2, ...rest }) => {
                    const [iconChildren, setIconChildren] = useState(FALLBACK_ICONS[prop] || null);

                    useEffect(() => {
                        if (iconChildren) return;
                        if (window.lucide && window.lucide.icons) {
                            const name = prop;
                            const upperName = name.charAt(0).toUpperCase() + name.slice(1).replace(/-([a-z])/g, g => g[1].toUpperCase());
                            
                            const iconDef = window.lucide.icons[name] || window.lucide.icons[upperName];
                            if (iconDef && Array.isArray(iconDef) && iconDef.length > 2) {
                                setIconChildren(iconDef[2]);
                            }
                        }
                    }, [prop, iconChildren]);

                    if (!iconChildren) {
                        return <span style={{display:'inline-block', width:size, height:size, background:'#f0f0f0', borderRadius:'2px'}} />;
                    }

                    const renderIconContent = (children) => {
                        return children.map(([tag, attrs, nestedChildren], index) => {
                            const reactAttrs = Object.keys(attrs).reduce((acc, key) => {
                                const reactKey = key.replace(/-([a-z])/g, g => g[1].toUpperCase());
                                acc[reactKey] = attrs[key];
                                return acc;
                            }, { key: index });

                            return React.createElement(
                                tag, 
                                reactAttrs, 
                                nestedChildren ? renderIconContent(nestedChildren) : null
                            );
                        });
                    };

                    return (
                        <svg 
                            xmlns="http://www.w3.org/2000/svg" 
                            width={size} 
                            height={size} 
                            viewBox="0 0 24 24" 
                            fill="none" 
                            stroke={color || "currentColor"}
                            strokeWidth={strokeWidth} 
                            strokeLinecap="round" 
                            strokeLinejoin="round" 
                            className={`lucide lucide-${prop.toLowerCase()} ${className}`} 
                            {...rest}
                        >
                            {renderIconContent(iconChildren)}
                        </svg>
                    );
                }
            }

        const compressImage = (file) => {
            return new Promise((resolve) => {
                const reader = new FileReader();
                reader.readAsDataURL(file);
                reader.onload = (event) => {
                    const img = new Image();
                    img.src = event.target.result;
                    img.onload = () => {
                        const canvas = document.createElement('canvas');
                        const MAX_WIDTH = 800;
                        const MAX_HEIGHT = 800;
                        let width = img.width;
                        let height = img.height;

                        if (width > height) {
                            if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                        } else {
                            if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                        }

                        canvas.width = width;
                        canvas.height = height;
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(img, 0, 0, width, height);
                        
                        resolve(canvas.toDataURL('image/jpeg', 0.5)); 
                    };
                };
            });
        };

        const usePersistentData = (collectionName, docId, initialValue, user, pathType='private') => {
          const [data, setData] = useState(initialValue);
          const [isLoaded, setIsLoaded] = useState(false);
          const [syncStatus, setSyncStatus] = useState('saved'); 
          const saveTimeoutRef = useRef(null);

          useEffect(() => {
            const localKey = `local_${collectionName}_${docId}`;
            const saved = localStorage.getItem(localKey);
            if (saved) { try { setData(JSON.parse(saved)); } catch (e) { console.error("LS Parse Error", e); } }
            setIsLoaded(true);
          }, [collectionName, docId]);

          useEffect(() => {
            if (!user || !db || !docId) return;
            
            let docRef;
            if (pathType === 'shared') {
                docRef = doc(db, 'artifacts', appId, 'itineraries', docId);
            } else {
                docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', collectionName, docId);
            }

            const unsubscribe = onSnapshot(docRef, (docSnap) => {
              if (docSnap.exists) {
                const cloudData = docSnap.data().data;
                setData(prev => {
                    if (JSON.stringify(prev) !== JSON.stringify(cloudData)) return cloudData;
                    return prev;
                });
              }
            }, (error) => {
                if (error.code !== 'permission-denied') console.error("Firestore sync error:", error);
            });
            return () => unsubscribe();
          }, [user, collectionName, docId, pathType]);

          const setValue = useCallback((newData) => {
              setData(newData);
              const localKey = `local_${collectionName}_${docId}`;
              localStorage.setItem(localKey, JSON.stringify(newData));

              setSyncStatus('saving');
              
              if (saveTimeoutRef.current) {
                  clearTimeout(saveTimeoutRef.current);
              }

              saveTimeoutRef.current = setTimeout(async () => {
                  if (user && db && docId) {
                      try {
                          let docRef;
                          if (pathType === 'shared') {
                              docRef = doc(db, 'artifacts', appId, 'itineraries', docId);
                          } else {
                              docRef = doc(db, 'artifacts', appId, 'users', user.uid, 'data', collectionName, docId);
                          }
                            
                          const safeData = JSON.parse(JSON.stringify(newData));
                          await setDoc(docRef, { data: safeData }, { merge: true });
                          setSyncStatus('saved');
                      } catch (e) { 
                          console.error("Firestore save error:", e); 
                          setSyncStatus('error');
                      }
                  } else {
                      setSyncStatus('saved'); 
                  }
              }, 500); 
          }, [user, collectionName, docId, pathType]);

          return [data, setValue, isLoaded, syncStatus];
        };

        const fetchWithBackoff = async (url, options) => {
          const delays = [1000, 2000, 4000];
          for (let i = 0; i <= delays.length; i++) {
            try {
              const response = await fetch(url, options);
              if (response.status === 429) throw new Error("QUOTA_EXCEEDED");
              if (!response.ok) { if (response.status >= 500) throw new Error(`Server Error: ${response.status}`); return response; }
              return response;
            } catch (error) { if (i === delays.length) throw error; await new Promise(resolve => setTimeout(resolve, delays[i])); }
          }
        };

        const smartGeocode = async (location) => {
          let localApiKey = localStorage.getItem('gemini_api_key');
          if (localApiKey) {
            try {
              const prompt = `Find the precise latitude and longitude for "${location}". Return ONLY raw JSON: {"lat": 35.123, "lng": 139.123}.`;
              const response = await fetchWithBackoff(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${localApiKey}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }], tools: [{ google_search: {} }] }) });
              if (!response.ok) return { error: 'INVALID_KEY' };
              const data = await response.json();
              let text = data.candidates?.[0]?.content?.parts?.[0]?.text;
              if (text) { const jsonMatch = text.match(/\{[\s\S]*\}/); if (jsonMatch) { return JSON.parse(jsonMatch[0]); } }
            } catch (e) { console.warn("AI Geocoding skipped:", e.message); }
          } 
          try {
            const geoRes = await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(location)}&count=1&language=zh&format=json`);
            const geoData = await geoRes.json();
            if (geoData.results?.length > 0) return { lat: geoData.results[0].latitude, lng: geoData.results[0].longitude };
          } catch (e) { console.error("Standard Geocoding failed:", e); }

        const ROUTE_COLORS = ['#E63946', '#457B9D', '#2A9D8F', '#F4A261', '#9C6644'];

        const LeafletMap = ({ itinerary, activeDay, onMarkerDrag, isEditMode, onToggleEditMode, onEventUpdate, onHideEvent, onMarkerClick }) => {
          const mapRef = useRef(null);
          const mapInstanceRef = useRef(null);
          const markerRefs = useRef({}); 
          const [mapLoaded, setMapLoaded] = useState(false);
          const mapId = useMemo(() => `map-${Math.random().toString(36).substr(2, 9)}`, []);

          const visibleItems = useMemo(() => {
            const dayData = itinerary.find(d => d.day === activeDay);
            if (!dayData) return [];
            
            let allItems = [];

            if (dayData.hasRoutes && dayData.routes) {
                Object.entries(dayData.routes).forEach(([routeKey, routeData], index) => {
                    const color = ROUTE_COLORS[index % ROUTE_COLORS.length];
                    const routeItems = (routeData.timeline || [])
                        .filter(i => i.lat && i.lng && i.icon !== 'plane' && i.type !== 'flight' && !i.hideOnMap)
                        .map((i, idx) => ({ 
                            ...i, 
                            label: `${idx + 1}`,
                            routeColor: color,
                            routeKey: routeKey
                        }));
                    allItems.push(...routeItems);
                });
            } else {
                const items = (dayData.timeline || [])
                    .filter(i => i.lat && i.lng && i.icon !== 'plane' && i.type !== 'flight' && !i.hideOnMap)
                    .map((i, idx) => ({ 
                        ...i, 
                        label: `${idx + 1}`, 
                        routeColor: '#2b4f60', 
                        routeKey: 'main'
                    }));
                allItems = items;
            }
            return allItems;
          }, [itinerary, activeDay]);

          useEffect(() => {
            if (!document.getElementById('leaflet-css')) {
              const link = document.createElement("link"); link.id = 'leaflet-css'; link.rel = "stylesheet"; link.href = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"; document.head.appendChild(link);
              const style = document.createElement('style'); style.innerHTML = `.leaflet-pane { z-index: 400; }`; document.head.appendChild(style);
            }
            if (window.L && window.L.map) { setMapLoaded(true); return; }
            const script = document.createElement("script"); script.src = "https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js"; script.async = true; script.onload = () => setMapLoaded(true); document.body.appendChild(script);
          }, []);

          useEffect(() => {
            if (!mapLoaded || !mapRef.current) return;
            if (!window.L || typeof window.L.map !== 'function') return;
            if (mapInstanceRef.current) { setTimeout(() => mapInstanceRef.current.invalidateSize(), 100); return; }
            try {
              const map = window.L.map(mapRef.current).setView([35.6895, 139.6917], 10);
              window.L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' }).addTo(map);
              mapInstanceRef.current = map;
              setTimeout(() => map.invalidateSize(), 1000);
            } catch(e) { console.log("Map Init Error", e); }
          }, [mapLoaded, mapId]);

          useEffect(() => {
            const map = mapInstanceRef.current;
            if (!map || !window.L) return;
            
            map.eachLayer((layer) => {

            });
            markerRefs.current = {}; 

            if (visibleItems.length === 0) { map.setView([35.6895, 139.6917], 10); return; }
            
            const routeGroups = {};
            const allLatlngs = [];

            visibleItems.forEach(m => {
              const pos = [m.lat, m.lng];
              if (!routeGroups[m.routeKey]) {
                  routeGroups[m.routeKey] = { color: m.routeColor, latlngs: [] };

              const icon = window.L.divIcon({

            if (code === 0) return <Sun size={16} className="text-amber-500" />;

            if (code >= 45 && code <= 48) return <Cloud size={16} className="text-slate-400" />;
            if (code >= 51 && code <= 67) return <CloudRain size={16} className="text-blue-400" />;
            if ([71, 73, 75, 77, 85, 86].includes(code)) return <Snowflake size={16} className="text-sky-300" />;
            if (code >= 80 && code <= 82) return <CloudRain size={16} className="text-blue-600" />;
            if (code >= 95) return <CloudRain size={16} className="text-purple-500" />;
            return <Sun size={16} className="text-amber-500" />;
          };

          const getWeatherDesc = (code) => {
            const codes = { 0: "晴朗", 1: "晴時多雲", 2: "多雲", 3: "陰天", 45: "霧", 48: "結冰霧", 51: "毛毛雨", 53: "小雨", 55: "大雨", 61: "小雨", 63: "中雨", 65: "豪雨", 71: "小雪", 73: "中雪", 75: "大雪", 77: "雪粒", 80: "陣雨", 81: "大陣雨", 82: "暴雨", 85: "陣雪", 86: "大陣雪", 95: "雷雨", 96: "雷雨伴冰雹" };
            return codes[code] || "未知";
          };

          useEffect(() => {
            const fetchWeather = async () => {
              setLoading(true);
              try {
                let lat = defaultLat || 35.6895; let long = defaultLng || 139.6917; 
                const isDefaultCity = targetCity === initialCity;
                if (!isDefaultCity || (!defaultLat && !defaultLng)) { const aiCoords = await smartGeocode(targetCity); if (aiCoords && aiCoords.lat) { lat = aiCoords.lat; long = aiCoords.lng; } }
                
                const res = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${lat}&longitude=${long}&current=temperature_2m,weather_code,wind_speed_10m&daily=weather_code,temperature_2m_max,temperature_2m_min&timezone=auto&forecast_days=8`);
                const data = await res.json();

                            </div>
                        </div>
                        <div className="p-4 overflow-y-auto space-y-2 flex-1 overscroll-contain">
                            {dailyForecast ? dailyForecast.time.map((t, i) => (
                                <div key={t} className="flex items-center justify-between p-2 hover:bg-stone-50 rounded-lg transition-colors border-b border-dashed border-stone-100 last:border-0">
                                    <span className={`text-sm font-bold w-20 ${i===0 ? 'text-[#2b4f60]' : 'text-stone-600'}`}>{getDayLabel(t, i)}</span>
                                    <div className="flex-1 flex justify-center">{getWeatherIcon(dailyForecast.weather_code[i])}</div>

                                        <span className="text-stone-300 mx-1">/</span>
                                        <span className="text-red-500">{Math.round(dailyForecast.temperature_2m_max[i])}°</span>
                                    </div>
                                </div>
                            )) : (
                                <div className="text-center text-stone-400 py-4 flex flex-col items-center"><Loader2 size={24} className="animate-spin mb-2" /><span>載入預報中...</span></div>
                            )}
                        </div>
                    </div>
                </div>,
                document.body
            )}
            </>
          );
        };

        const FlightCard = ({ data, isEditing, onDelete, onUpdate, isReadOnly, onMoveUp, onMoveDown, isFirst, isLast, onEditStart, onEditEnd }) => {
          const [isEditMode, setIsEditMode] = useState(false);

                    <div className="w-[38px] h-[38px] rounded-full bg-blue-50 border-2 border-[#FDFCF8] shadow-sm flex items-center justify-center text-blue-500 relative z-10">{renderIconOrClass('plane', 20)}</div>
                </div>
                <div className="flex-1 bg-white rounded-xl shadow-sm border border-blue-100 overflow-hidden relative transition-all z-10">
                  <div className="h-1.5 w-full bg-gradient-to-r from-blue-400 to-blue-600"></div>
                  <div className="p-4">
                      {isEditMode ? (
                        <div className="space-y-3"><div className="flex flex-col gap-2"><input className="flex-1 border rounded p-1.5 text-sm font-bold" value={editData.title} onChange={e=>setEditData({...editData, title:e.target.value})} placeholder="航班代號"/><input className="flex-1 border rounded p-1.5 text-sm" value={editData.airline} onChange={e=>setEditData({...editData, airline:e.target.value})} placeholder="航空公司"/></div><div className="grid grid-cols-2 gap-4 bg-stone-50 p-2 rounded-lg border border-stone-100"><div><label className="text-[10px] text-stone-400 font-bold block mb-1">DEPARTURE</label><input className="w-full border rounded p-1 text-xs mb-1" value={editData.depTime} onChange={e=>setEditData({...editData, depTime:e.target.value})} placeholder="時間"/><input className="w-full border rounded p-1 text-xs font-mono" value={editData.depLoc} onChange={e=>setEditData({...editData, depLoc:e.target.value})} placeholder="機場"/></div><div><label className="text-[10px] text-stone-400 font-bold block mb-1">ARRIVAL</label><input className="w-full border rounded p-1 text-xs mb-1" value={editData.arrTime} onChange={e=>setEditData({...editData, arrTime:e.target.value})} placeholder="時間"/><input className="w-full border rounded p-1 text-xs font-mono" value={editData.arrLoc} onChange={e=>setEditData({...editData, arrLoc:e.target.value})} placeholder="機場"/></div></div><div className="flex justify-end gap-2 pt-2"><button onClick={()=>setIsEditMode(false)} className="text-xs text-stone-500 px-3 py-1">取消</button><button onClick={handleSave} className="bg-blue-600 text-white text-xs px-4 py-1.5 rounded-lg shadow font-bold">儲存</button></div></div>
                      ) : (
                        <div className="flex flex-col"><div className="flex justify-between items-center mb-4"><div className="flex items-center gap-2"><div className="font-black text-lg text-stone-800">{editData.title}</div><div className="text-xs bg-blue-50 text-blue-600 px-2 py-0.5 rounded font-bold">{editData.airline}</div></div><div className="text-stone-300">{renderIconOrClass('plane', 16)}</div></div><div className="flex justify-between items-center px-2"><div className="text-center"><div className="text-2xl font-black text-stone-800 leading-none">{editData.depTime}</div><div className="text-sm font-bold text-stone-400 mt-1 font-mono tracking-wider">{editData.depLoc}</div></div><div className="flex-1 mx-4 flex flex-col items-center"><div className="w-full h-px bg-stone-300 relative flex justify-center mt-2 mb-2"><div className="absolute -top-3 text-blue-400 rotate-90 bg-white px-1">{renderIconOrClass('plane', 20)}</div></div></div><div className="text-center"><div className="text-2xl font-black text-stone-800 leading-none">{editData.arrTime}</div><div className="text-sm font-bold text-stone-400 mt-1 font-mono tracking-wider">{editData.arrLoc}</div></div></div></div>
                      )}
                  </div>
                  {isEditing && !isEditMode && !isReadOnly && (
                      <div className="flex gap-2 p-2 bg-stone-50 border-t border-stone-100 items-center">
                          <button onClick={()=>{setIsEditMode(true); if(onEditStart) onEditStart();}} className="flex-1 bg-white border border-stone-200 text-stone-600 py-1.5 rounded text-xs font-bold flex items-center justify-center gap-1 hover:bg-stone-100"><Pencil size={12}/> 修改</button>
                          <div className="flex gap-1 border-l border-stone-200 pl-2"><button onClick={onMoveUp} disabled={isFirst} className={`p-1.5 rounded border border-stone-200 ${isFirst ? 'bg-stone-50 text-stone-300' : 'bg-white text-stone-600 hover:bg-stone-100'}`}><ChevronUp size={14}/></button><button onClick={onMoveDown} disabled={isLast} className={`p-1.5 rounded border border-stone-200 ${isLast ? 'bg-stone-50 text-stone-300' : 'bg-white text-stone-600 hover:bg-stone-100'}`}><ChevronDown size={14}/></button></div>
                          <button onClick={onDelete} className="w-8 bg-white border border-red-100 text-red-500 py-1.5 rounded flex items-center justify-center hover:bg-red-50"><Trash2 size={12}/></button>
                      </div>
                  )}
                </div>
              </div>
          );
        };

        const TransportCard = ({ data, isEditing, onDelete, onUpdate, isReadOnly, onMoveUp, onMoveDown, isFirst, isLast, onEditStart, onEditEnd }) => {
          const IconComponent = ICON_MAP[data.icon] || Train;

          const isWalk = data.icon === 'walk' || data.mode === 'walk';

          return (
            <div className="flex relative pl-4 pb-6 group">
              {!isLast && <div className="absolute left-[35px] top-0 bottom-0 w-0.5 border-l-2 border-dashed border-stone-300 z-0"></div>}
              <div className="w-10 flex flex-col items-center mr-4 shrink-0 z-10 pt-1">
                  <div className="w-8 h-8 rounded-full bg-[#FDFCF8] border border-stone-200 shadow-sm flex items-center justify-center text-stone-400 relative z-10"><IconComponent size={14} /></div>
              </div>
              <div className={`flex-1 bg-[#F7F5F0] rounded p-3 border border-stone-100 text-sm flex flex-col relative transition-all z-10 ${isEditing ? 'border-dashed border-stone-300' : ''}`}>

                  <div className="w-full space-y-2"><input className="w-full p-1 border rounded" value={editData.name} onChange={e=>setEditData({...editData, name:e.target.value})} placeholder="名稱"/><div><label className="text-[10px] text-stone-400 font-bold block mb-1">所需時間</label><input type="text" className="w-full p-1 border rounded text-sm" value={editData.duration || ''} onChange={e=>setEditData({...editData, duration:e.target.value})} placeholder="例如 01:30" /></div><div><label className="text-[10px] text-stone-400 font-bold block mb-1">備註</label><textarea className="w-full p-1 border rounded text-sm" rows={2} value={editData.desc || ''} onChange={e=>setEditData({...editData, desc:e.target.value})} placeholder="備註..." /></div>{!isWalk && (<input className="w-full p-1 border rounded" value={editData.cost} onChange={e=>setEditData({...editData, cost: e.target.value})} placeholder="費用 (例如: ¥2000)"/>)}<div className="flex justify-end gap-2 mt-2"><button onClick={()=>setIsEditMode(false)} className="text-stone-500 text-xs px-2 py-1">取消</button><button onClick={handleSave} className="bg-[#2b4f60] text-white text-xs px-3 py-1 rounded">儲存</button></div></div>
                ) : (
                  <div className="flex justify-between items-center w-full"><div><div className="font-bold text-stone-700 flex items-center gap-2 font-serif">{data.name} {data.duration && (<span className="text-[10px] bg-blue-50 text-blue-600 px-1.5 py-0.5 rounded border border-blue-100 flex items-center gap-1 font-mono"><Clock size={10}/> {data.duration}</span>)}</div><div className="text-xs text-stone-500 mt-0.5">{String(data.desc || '')}</div></div>{!isWalk && (<div className="text-right"><div className="font-bold text-stone-700 font-serif">{data.cost ? (typeof data.cost === 'number' ? data.cost.toLocaleString() : data.cost) : ''}</div></div>)}</div>
                )}

                        <div className="flex gap-1"><button onClick={onMoveUp} disabled={isFirst} className={`p-1 rounded border border-stone-200 ${isFirst ? 'bg-stone-50 text-stone-300' : 'bg-white text-stone-600 hover:bg-stone-100'}`}><ChevronUp size={10}/></button><button onClick={onMoveDown} disabled={isLast} className={`p-1 rounded border border-stone-200 ${isLast ? 'bg-stone-50 text-stone-300' : 'bg-white text-stone-600 hover:bg-stone-100'}`}><ChevronDown size={10}/></button></div>

          const [isLocalEditing, setIsLocalEditing] = useState(false);
          const [editData, setEditData] = useState({ ...data });
          const [tempSubItems, setTempSubItems] = useState("");
          const [isSearching, setIsSearching] = useState(false);
          const [showUrlInput, setShowUrlInput] = useState(false);
          const [newImageUrl, setNewImageUrl] = useState("");
          const fileInputRef = useRef(null);
          
          const isAirport = data.icon === 'airport';

          if (data.type === 'flight') return <FlightCard data={data} isEditing={isEditing} onDelete={onDelete} onUpdate={onUpdate} isReadOnly={isReadOnly} isLast={isLast} onEditStart={onEditStart} onEditEnd={onEditEnd} onMoveUp={onMoveUp} onMoveDown={onMoveDown} isFirst={isFirst} />;
          if (data.type === 'transport') return <TransportCard data={data} isEditing={isEditing} onDelete={onDelete} onUpdate={onUpdate} isReadOnly={isReadOnly} isLast={isLast} onEditStart={onEditStart} onEditEnd={onEditEnd} onMoveUp={onMoveUp} onMoveDown={onMoveDown} isFirst={isFirst} />;

          const handleAutoCoords = async () => { if(onAutoCoords) { setIsSearching(true); const query = (editData.location && editData.location !== "未設定") ? editData.location : editData.title; if (!query || query === "未設定" || query === "新項目") { onAutoCoords("ERROR_EMPTY_QUERY"); setIsSearching(false); return; } const coords = await onAutoCoords(query); setIsSearching(false); if(coords && coords.lat) { setEditData({...editData, lat: coords.lat, lng: coords.lng}); } } };

                      <div><label className="text-xs font-bold text-stone-500 mb-1 block ml-1">推薦/子項目 (用 / 分隔)</label><input className="w-full text-xs p-2 border rounded bg-stone-50" value={tempSubItems} onChange={(e) => setTempSubItems(e.target.value)} placeholder="例: 必吃布丁 / 買伴手禮 / 拍照點" /></div>
                      <div className="flex justify-end gap-2 mt-2"><button onClick={()=>setIsLocalEditing(false)} className="text-stone-500 text-xs px-2 py-1">取消</button><button onClick={handleSave} className="bg-[#2b4f60] text-white text-xs px-3 py-1 rounded">儲存</button></div></div>
                  ) : (
                    <React.Fragment>
                      <div className="flex justify-between items-start mb-1"><div className="flex items-center gap-2"><span className="text-sm font-bold text-[#2b4f60] font-mono bg-stone-100 px-1.5 py-0.5 rounded">{data.time}</span><h3 className={`font-bold text-base font-serif ${data.highlight ? 'text-[#B74B4B]' : 'text-[#2C3E50]'}`}>{String(data.title || '')}</h3></div><div className="flex items-center gap-2">{data.link && <a href={data.link} target="_blank" rel="noreferrer" className="text-stone-400 hover:text-blue-600 bg-stone-50 p-1 rounded-full"><LinkIcon size={14} /></a>}<a href={getMapLink(data.location)} target="_blank" className="text-stone-400 hover:text-blue-600 bg-stone-50 p-1 rounded-full"><Navigation size={14} /></a></div></div>
                      <div className="text-xs text-stone-500 flex items-center gap-1 mb-3 ml-1"><MapPin size={10} /> {String(data.location || '')}</div><p className="text-sm text-stone-600 leading-relaxed ml-1">{String(data.desc || '')}</p>
                      {data.images && data.images.length > 0 && (<div className="mt-3 ml-1 flex gap-2 overflow-x-auto pb-2 no-scrollbar">{data.images.map((img, idx) => (<img key={idx} src={img} className="h-20 w-auto rounded-lg shadow-sm border border-stone-100 object-cover cursor-pointer hover:scale-105 transition-transform" onClick={() => window.open(img, '_blank')} />))}</div>)}
                      {data.subItems && Array.isArray(data.subItems) && data.subItems.length > 0 && (<div className="mt-3 space-y-1.5 bg-[#F7F5F0] p-3 rounded-lg border border-stone-100"><div className="text-[10px] text-stone-400 font-bold mb-1 flex items-center gap-1"><Star size={10}/> 必吃必買推薦</div>{data.subItems.map((item, idx) => { const SubIcon = ICON_MAP[item.icon] || MapPin; return ( <div key={idx} className="flex items-center gap-2 text-xs text-stone-600 font-medium"><SubIcon size={12} className="text-[#B74B4B]" /> {String(item.text || '')}</div> ); })}</div>)}
                      <div className="flex justify-between items-center mt-2"><button onClick={() => setIsExpanded(!isExpanded)} className="text-[10px] text-[#2b4f60] font-bold hover:underline" onMouseDown={(e) => e.stopPropagation()}>{isExpanded ? '收起' : '詳細'}</button></div>

        const MenuItemModal = ({ item, initialQty = 1, initialOptions = [], onClose, onAdd, isOpen }) => {
            const [quantity, setQuantity] = useState(initialQty);
            const [options, setOptions] = useState([]);

            useEffect(() => {
                setQuantity(initialQty);
                if (item.options && Array.isArray(item.options) && item.options.length > 0) {
                    setOptions(item.options.map(o => ({ ...o, checked: initialOptions.includes(o.label) })));
                } else {
                    setOptions([]);
                }
            }, [item, initialQty, initialOptions]);

            if (!isOpen) return null;

            const toggleOption = (id) => {
                setOptions(opts => opts.map(o => o.id === id ? { ...o, checked: !o.checked } : o));
            };

            const calculatePrice = () => {
                const basePrice = parseInt(String(item.price).replace(/\D/g, '') || 0);

            return (
                <div className="fixed inset-0 bg-black/60 backdrop-blur-sm z-[2000] flex items-center justify-center p-4 animate-fade-in" onClick={onClose}>
                    <div className="bg-white w-full max-w-sm rounded-2xl overflow-hidden shadow-2xl flex flex-col max-h-[85vh]" onClick={e => e.stopPropagation()}>
                        <div className="p-4 border-b border-stone-100 bg-stone-50 flex justify-between items-start">
                            <div>

                                    <h4 className="text-xs font-bold text-stone-400 uppercase tracking-wider mb-2">客製化選項</h4>

                                            <div key={opt.id} onClick={() => toggleOption(opt.id)} className={`flex items-center p-3 rounded-xl border cursor-pointer transition-all ${opt.checked ? 'bg-indigo-50 border-indigo-200' : 'bg-white border-stone-200'}`}>
                                                <div className={`w-5 h-5 rounded-full border mr-3 flex items-center justify-center ${opt.checked ? 'bg-indigo-600 border-indigo-600' : 'border-stone-300'}`}>
                                                    {opt.checked && <Check size={12} className="text-white"/>}
                                                </div>
                                                <span className={`text-sm font-bold ${opt.checked ? 'text-indigo-700' : 'text-stone-600'}`}>{opt.label}</span>
                                            </div>
                                        ))}
                                    </div>
                                </>
                            )}
                        </div>
                        <div className="p-4 border-t border-stone-100 bg-white">
                            <div className="flex items-center justify-between mb-4">
                                <span className="text-sm font-bold text-stone-600">數量</span>
                                <div className="flex items-center gap-3 bg-stone-100 rounded-full p-1">
                                    <button onClick={() => setQuantity(Math.max(1, quantity - 1))} className="w-8 h-8 bg-white rounded-full shadow-sm flex items-center justify-center text-stone-600 hover:bg-stone-50"><Minus size={16}/></button>
                                    <span className="text-lg font-bold w-6 text-center">{quantity}</span>
                                    <button onClick={() => setQuantity(quantity + 1)} className="w-8 h-8 bg-white rounded-full shadow-sm flex items-center justify-center text-stone-600 hover:bg-stone-50"><Plus size={16}/></button>
                                </div>

                                onAdd(item, quantity, options.filter(o => o.checked).map(o => o.label));

                                {initialQty > 1 ? '更新訂單' : '加入點餐清單'} - ¥{calculatePrice().toLocaleString()}
                            </button>
                        </div>
                    </div>
                </div>
            );
        };

        const TranslationView = () => { 
            const LANGUAGES = [ { code: 'auto', label: '自動偵測', flag: '✨' }, { code: 'zh-TW', label: '繁體中文', flag: '🇹🇼' }, { code: 'en', label: 'English', flag: '🇺🇸' }, { code: 'ja', label: '日本語', flag: '🇯🇵' }, { code: 'ko', label: '한국어', flag: '🇰🇷' }, { code: 'th', label: 'ไทย', flag: '🇹🇭' }, { code: 'vi', label: 'Tiếng Việt', flag: '🇻🇳' } ]; 
            const [viewMode, setViewMode] = useState('home'); 
            const [photoMode, setPhotoMode] = useState('general'); 
            const [step, setStep] = useState('upload'); 
            const [selectedImages, setSelectedImages] = useState([]); 
            const [sourceLang, setSourceLang] = useState('auto'); 
            const [targetLang, setTargetLang] = useState('zh-TW'); 
            const [menuItems, setMenuItems] = useState([]); 
            const [generalTranslation, setGeneralTranslation] = useState(''); 
            const [omikujiResult, setOmikujiResult] = useState(null); 
            const [cart, setCart] = useState({}); 
            const [error, setError] = useState(''); 
            const [loadingMsg, setLoadingMsg] = useState(''); 
            const [activeCategory, setActiveCategory] = useState(''); 
            const [inputText, setInputText] = useState(''); 
            const [textResult, setTextResult] = useState(''); 
            const [isTranslatingText, setIsTranslatingText] = useState(false); 
            const [isListening, setIsListening] = useState(false); 
            const [selectedMenuItem, setSelectedMenuItem] = useState(null); 
            const [showOrderList, setShowOrderList] = useState(false);
            
            // 🛑 修正：加入手動滾動鎖，避免 Scroll Spy 打架
            const isManualScroll = useRef(false);

            const menuContainerRef = useRef(null); 
            const fileInputRef = useRef(null); 
            const recognitionRef = useRef(null); 
            
            const groupedMenu = useMemo(() => {
                return menuItems.reduce((acc, item) => { 
                    const cat = item.category || '其他'; 
                    if (!acc[cat]) acc[cat] = []; 
                    acc[cat].push(item); 
                    return acc; 
                }, {});
            }, [menuItems]);

            useEffect(() => {
                const container = menuContainerRef.current;
                if (!container || photoMode !== 'menu' || step !== 'result') return;

                const handleScroll = () => {
                    // 如果正在手動跳轉中，不要執行 scroll spy
                    if (isManualScroll.current) return;

                    const scrollPosition = container.scrollTop + 140; 
                    const categories = Object.keys(groupedMenu);
                    
                    for (const cat of categories) {
                        const element = document.getElementById(`cat-${cat}`);
                        if (element) {
                            if (element.offsetTop <= scrollPosition && (element.offsetTop + element.offsetHeight) > scrollPosition) {
                                setActiveCategory(cat);
                                const btn = document.getElementById(`btn-cat-${cat}`);
                                if (btn) {
                                    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
                                }
                            }
                        }
                    }
                };

                container.addEventListener('scroll', handleScroll);
                return () => container.removeEventListener('scroll', handleScroll);
            }, [groupedMenu, photoMode, step]);

            // 🛑 修正：點擊分類時開啟手動鎖，並在結束後關閉
            const scrollToCategory = (cat) => { 
                isManualScroll.current = true; // 鎖住 Scroll Spy
                setActiveCategory(cat); 
                const element = document.getElementById(`cat-${cat}`); 
                const container = document.getElementById('menu-scroll-area'); 
                if (element && container) {
                    container.scrollTo({ top: element.offsetTop - 120, behavior: 'smooth' }); 
                    
                    // 0.6秒後解鎖 (假設動畫完成)
                    setTimeout(() => {
                        isManualScroll.current = false;
                    }, 600);
                }
            };

            const swapLanguages = () => { if (sourceLang === 'auto') { setSourceLang(targetLang); setTargetLang('zh-TW'); } else { const temp = sourceLang; setSourceLang(targetLang); setTargetLang(temp); } }; 
            
            useEffect(() => { if ('webkitSpeechRecognition' in window || 'SpeechRecognition' in window) { const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition; recognitionRef.current = new SpeechRecognition(); recognitionRef.current.continuous = false; recognitionRef.current.interimResults = false; recognitionRef.current.lang = sourceLang === 'auto' ? 'zh-TW' : sourceLang; recognitionRef.current.onresult = (event) => { const transcript = event.results[0][0].transcript; setInputText(prev => prev + (prev ? ' ' : '') + transcript); setIsListening(false); }; recognitionRef.current.onerror = (event) => { console.error("Speech recognition error", event.error); setIsListening(false); }; recognitionRef.current.onend = () => setIsListening(false); } }, [sourceLang]); 
            const toggleListening = () => { if (!recognitionRef.current) { alert("您的瀏覽器不支援語音輸入功能。"); return; } if (isListening) { recognitionRef.current.stop(); } else { recognitionRef.current.lang = sourceLang === 'auto' ? 'zh-TW' : sourceLang; recognitionRef.current.start(); setIsListening(true); } }; 
            const handleImageUpload = (e) => { const files = Array.from(e.target.files); if (files.length > 0) { const newImages = []; let processedCount = 0; files.forEach(file => { const reader = new FileReader(); reader.onloadend = () => { newImages.push(reader.result); processedCount++; if (processedCount === files.length) setSelectedImages(prev => [...prev, ...newImages]); }; reader.readAsDataURL(file); }); } }; 
            
            const processImages = async (manualSourceLang = null) => { 
                if (selectedImages.length === 0) return; 
                const key = localStorage.getItem('gemini_api_key'); 
                if (!key) { setError("請先點擊右上角設定 API Key"); return; } 
                setStep('processing'); setError(''); 
                const currentSource = typeof manualSourceLang === 'string' ? manualSourceLang : sourceLang; 
                try { 
                    const targetLangName = LANGUAGES.find(l => l.code === targetLang)?.label || targetLang; 
                    const promptTarget = targetLang === 'zh-TW' ? 'Traditional Chinese (Taiwan) which is 繁體中文' : targetLangName; 
                    const sourceLangInstruction = currentSource === 'auto' ? "detect the language" : `the language is ${currentSource}`; 
                    let promptText = ""; 
                    if (photoMode === 'menu') { 
                        setLoadingMsg(`AI 正在分析菜單...`); 
                        promptText = `Analyze these menu images (${sourceLangInstruction}). Identify all distinct menu items. Group items by section headers. Translate item names, descriptions, and category to ${promptTarget}. IMPORTANT: 1. Extract price EXACTLY. 2. Extract options. 3. Return ONLY raw JSON array: [{id, originalName, translatedName, price, description, category, originalCategory, options: [{id, label}, ...]}]. Note: 'category' should be the translated category name, and 'originalCategory' should be the text found on the menu.`; 
                    } else if (photoMode === 'omikuji') { 
                        setLoadingMsg(`AI 正在解籤...`); 
                        promptText = `Analyze this Omikuji (Fortune Slip). 1. Identify Fortune status. 2. Translate text to ${promptTarget}. 3. Provide advice in ${promptTarget}. 4. Return ONLY raw JSON: { "fortune": "...", "translation": "...", "advice": "..." }`; 
                    } else { 
                        setLoadingMsg(`AI 正在翻譯圖片...`); 
                        promptText = `Extract all text from these images and translate it to ${promptTarget}. Preserve layout using Markdown.`; 
                    } 
                    const parts = [{ text: promptText }]; 
                    selectedImages.forEach(img => { const base64Data = img.split(',')[1]; parts.push({ inlineData: { mimeType: "image/jpeg", data: base64Data } }); }); 
                    const response = await fetchWithBackoff(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: 'user', parts }] }) }); 
                    const data = await response.json(); 
                    if(data.error) throw new Error(data.error.message); 
                    let text = data.candidates?.[0]?.content?.parts?.[0]?.text; 
                    if (photoMode === 'menu') { 
                        text = text.split("```json").join("").split("```").join("").trim(); 
                        const parsed = JSON.parse(text); 
                        const formatted = parsed.map((item, idx) => ({ ...item, id: idx + 1 })); 
                        setMenuItems(formatted); 
                        if(formatted.length > 0) setActiveCategory(formatted[0].category || '其他'); 
                    } else if (photoMode === 'omikuji') { 
                        text = text.split("```json").join("").split("```").join("").trim(); 
                        try { const parsed = JSON.parse(text); setOmikujiResult(parsed); } catch (e) { setOmikujiResult({ fortune: "解析結果", translation: text, advice: "" }); } 
                    } else { setGeneralTranslation(text); } 
                    setStep('result'); 
                } catch (err) { console.warn(err); setError(err.message === "QUOTA_EXCEEDED" ? "API 配額已滿" : "辨識失敗: " + err.message); setStep('upload'); } 
            }; 
            
            const handleTextTranslate = async () => { if (!inputText.trim()) return; const key = localStorage.getItem('gemini_api_key'); if (!key) { setError("請先點擊右上角設定 API Key"); return; } setIsTranslatingText(true); setError(''); try { const sourceLangName = sourceLang === 'auto' ? 'the detected language' : (LANGUAGES.find(l => l.code === sourceLang)?.label || sourceLang); const targetLangName = LANGUAGES.find(l => l.code === targetLang)?.label || targetLang; const promptTarget = targetLang === 'zh-TW' ? 'Traditional Chinese (Taiwan) which is 繁體中文' : targetLangName; const prompt = `Translate the following text from ${sourceLangName} to ${promptTarget}. Return ONLY the translation.\n\nText: ${inputText}`; const response = await fetchWithBackoff(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${key}`, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] }) }); const data = await response.json(); if(data.error) throw new Error(data.error.message); const resultText = data.candidates?.[0]?.content?.parts?.[0]?.text; setTextResult(resultText); } catch (err) { setError("翻譯失敗: " + err.message); } finally { setIsTranslatingText(false); } }; 
            
            const addToCart = (item, qty, options) => { 
                const uniqueKey = `${item.id}-${options.sort().join(',')}`;
                setCart(prev => {
                    const existing = prev[uniqueKey] || { qty: 0 };
                    return { ...prev, [uniqueKey]: { qty: existing.qty + qty, options, originalId: item.id } };
                });
                setSelectedMenuItem(null); 
            }; 
            
            const getTotalCount = () => Object.values(cart).reduce((a, b) => a + b.qty, 0); 
            const getTotalPrice = () => Object.entries(cart).reduce((total, [key, data]) => {

              <GlobalSettings isOpen={showSettings} onClose={() => setShowSettings(false)} user={user} quotaFull={apiQuotaFull} />
              
              <div className="bg-[#FDFCF8] border-t border-stone-200 pb-safe pt-2 px-2 grid grid-cols-5 shrink-0 z-30 shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                  <button onClick={() => setView('itinerary')} className={`flex flex-col items-center justify-center p-2 gap-1 transition-colors ${view === 'itinerary' ? 'text-[#2b4f60]' : 'text-stone-300 hover:text-stone-50'}`}> <BookOpen size={22} strokeWidth={view === 'itinerary' ? 2.5 : 2} /><span className="text-[10px] font-bold font-serif">行程</span> </button>
                  <button onClick={() => setView('expenses')} className={`flex flex-col items-center justify-center p-2 gap-1 transition-colors ${view === 'expenses' ? 'text-[#2b4f60]' : 'text-stone-300 hover:text-stone-500'}`}> <Wallet size={22} strokeWidth={view === 'expenses' ? 2.5 : 2} /><span className="text-[10px] font-bold font-serif">記帳</span> </button>
                  <button onClick={() => setView('packing')} className={`flex flex-col items-center justify-center p-2 gap-1 transition-colors ${view === 'packing' ? 'text-[#2b4f60]' : 'text-stone-300 hover:text-stone-500'}`}> <Luggage size={22} strokeWidth={view === 'packing' ? 2.5 : 2} /><span className="text-[10px] font-bold font-serif">行李</span> </button>
                  <button onClick={() => setView('translation')} className={`flex flex-col items-center justify-center p-2 gap-1 transition-colors ${view === 'translation' ? 'text-[#2b4f60]' : 'text-stone-300 hover:text-stone-500'}`}> <Languages size={22} strokeWidth={view === 'translation' ? 2.5 : 2} /><span className="text-[10px] font-bold font-serif">翻譯</span> </button>
                  <button onClick={() => setView('info')} className={`flex flex-col items-center justify-center p-2 gap-1 transition-colors ${view === 'info' ? 'text-[#2b4f60]' : 'text-stone-300 hover:text-stone-500'}`}> <Info size={22} strokeWidth={view === 'info' ? 2.5 : 2} /><span className="text-[10px] font-bold font-serif">資訊</span> </button>
              </div>
            </div>
          );
        };

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
